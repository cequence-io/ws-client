name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt scalafmtCheckAll scalafmtSbtCheck
      # cross-builds every module for each of its Scala versions (2.12 / 2.13 / 3.2 / 3.3)
      - name: Test
        run: sbt +test
      # binary compatibility against the previous release (project/ReleaseChecks.scala)
      - name: Binary compatibility
        run: sbt +mimaReportBinaryIssues
      # the published Scala 3 jars of the 3.2-line modules must stay TASTy 28.2, and no
      # published class may target a Java newer than 11
      - name: TASTy and class file versions
        run: sbt +tastyCheck +classVersionCheck

  # beyond the tests: the concurrent stream classes under a model checker
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # Lincheck: the classes themselves, under the interleavings of each scenario's threads
      - name: Model checks
        run: sbt modelCheck
      # TLC: the designs (formal/tla) - the specs must hold, the seeded bugs must be rejected
      - name: TLA+ specs
        run: formal/tla/check.sh --fetch
